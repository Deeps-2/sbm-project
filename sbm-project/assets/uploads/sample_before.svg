<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="roadBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
  </defs>
  <!-- Background Wall & Sky -->
  <rect width="600" height="220" fill="url(#skyBg)"/>
  <rect x="0" y="160" width="600" height="70" fill="#78909c"/>
  <line x1="0" y1="230" x2="600" y2="230" stroke="#455a64" stroke-width="4"/>

  <!-- Road / Pavement -->
  <rect x="0" y="230" width="600" height="170" fill="url(#roadBg)"/>
  <rect x="0" y="230" width="600" height="25" fill="#90a4ae"/>

  <!-- Overflowing Dumpster -->
  <g transform="translate(180, 110)">
    <!-- Bin Body -->
    <rect x="40" y="60" width="160" height="130" rx="8" fill="#2e7d32" stroke="#1b5e20" stroke-width="4"/>
    <rect x="50" y="80" width="140" height="10" fill="#388e3c"/>
    <text x="120" y="145" font-family="sans-serif" font-weight="900" font-size="16" fill="#c8e6c9" text-anchor="middle">MUNICIPAL BIN</text>
    <!-- Overflowing trash bags -->
    <ellipse cx="90" cy="55" rx="35" ry="25" fill="#424242"/>
    <ellipse cx="150" cy="50" rx="40" ry="28" fill="#616161"/>
    <ellipse cx="120" cy="35" rx="30" ry="22" fill="#212121"/>
    <!-- Fallen bottles and boxes -->
    <rect x="180" y="160" width="40" height="30" fill="#8d6e63" transform="rotate(15 180 160)"/>
  </g>

  <!-- Litter Scattered Across Ground -->
  <g>
    <!-- Plastic cups & bottles -->
    <ellipse cx="130" cy="290" rx="14" ry="7" fill="#00acc1" opacity="0.9" transform="rotate(-20 130 290)"/>
    <ellipse cx="160" cy="320" rx="18" ry="8" fill="#43a047" opacity="0.8" transform="rotate(35 160 320)"/>
    <ellipse cx="380" cy="275" rx="22" ry="9" fill="#e53935" opacity="0.85" transform="rotate(-15 380 275)"/>
    <ellipse cx="440" cy="310" rx="15" ry="8" fill="#fdd835" opacity="0.9" transform="rotate(40 440 310)"/>

    <!-- Discarded wrapper debris -->
    <path d="M 80,310 Q 110,300 120,330 Q 90,340 80,310" fill="#ff7043" opacity="0.95"/>
    <path d="M 230,280 Q 270,270 280,300 Q 240,310 230,280" fill="#ab47bc" opacity="0.85"/>
    <path d="M 320,330 Q 360,320 370,350 Q 330,360 320,330" fill="#7e57c2" opacity="0.9"/>
    <path d="M 480,285 Q 520,275 530,305 Q 490,315 480,285" fill="#26a69a" opacity="0.85"/>

    <!-- Large Garbage Pile on Left -->
    <path d="M 40,370 C 60,280 140,290 190,370 Z" fill="#4e342e" opacity="0.95"/>
    <ellipse cx="110" cy="330" rx="45" ry="25" fill="#3e2723"/>
    <ellipse cx="80" cy="345" rx="30" ry="18" fill="#5d4037"/>

    <!-- Stains / dirty marks on pavement -->
    <ellipse cx="290" cy="310" rx="60" ry="16" fill="#263238" opacity="0.4"/>
    <ellipse cx="450" cy="330" rx="70" ry="20" fill="#263238" opacity="0.35"/>
  </g>

  <!-- Status Stamp -->
  <rect x="20" y="20" width="160" height="42" rx="8" fill="#d32f2f" opacity="0.92"/>
  <text x="100" y="47" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">⚠️ BEFORE CLEANING</text>
</svg>